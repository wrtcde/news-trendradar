name: Schedule Probe

# 诊断用：本仓库的 GitHub 定时任务一直没触发（11 次运行全是手动 dispatch）。
# 这个 workflow 什么都不做，只每 5 分钟打一条时间戳，用来判定调度器到底有没有在工作。
# 得出结论后就可以删掉它（它不跑爬虫、不推送、不依赖任何第三方 action）。

on:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "::notice::schedule fired at $NOW"
          echo "schedule fired at $NOW" >> "$GITHUB_STEP_SUMMARY"
